name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Create Admin Account
        shell: pwsh
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force
          New-LocalUser -Name "NvDAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NvDAdmin" -ErrorAction SilentlyContinue
          net user runneradmin P@ssw0rd1qazXSW@#

      - name: 3. Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host ">>> Downloading Tailscale..."
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"

          Write-Host ">>> Installing Tailscale..."
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 12

          if (-not (Test-Path "C:\Program Files\Tailscale\tailscale.exe")) {
            Write-Host ">>> ERROR: tailscale.exe not found!" -ForegroundColor Red
            exit 1
          }
          Write-Host ">>> Tailscale installed successfully." -ForegroundColor Green

      - name: 3.2. Force Tailscale to use DERP (TCP 443 - bypass ISP UDP block)
        shell: pwsh
        run: |
          Write-Host ">>> Setting machine-level env vars to force TCP/DERP..."

          [System.Environment]::SetEnvironmentVariable("TS_DEBUG_ALWAYS_USE_DERP", "true", "Machine")
          [System.Environment]::SetEnvironmentVariable("TS_DEBUG_USE_DERP_HTTPS", "true", "Machine")

          Restart-Service Tailscale -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 8

          Write-Host ">>> Tailscale now forced to use DERP over TCP 443." -ForegroundColor Green
          Write-Host ">>> This bypasses ISP's UDP throttling." -ForegroundColor Green

      - name: 3.5. Connect to Tailscale VPN (Optimized)
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Continue"
          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          & $ts down 2>&1 | Out-Host
          $global:LASTEXITCODE = 0
          Start-Sleep -Seconds 3

          Write-Host ">>> Connecting to Tailscale network..."
          $upArgs = @(
            "up",
            "--authkey=$Env:TAILSCALE_AUTHKEY",
            "--hostname=github-rdp-server",
            "--accept-dns=false",
            "--accept-routes=false",
            "--advertise-exit-node=false",
            "--unattended"
          )
          & $ts @upArgs 2>&1 | Out-Host
          $global:LASTEXITCODE = 0

          Start-Sleep -Seconds 20

          Write-Host ""
          Write-Host "===== NETCHECK REPORT =====" -ForegroundColor Cyan
          & $ts netcheck 2>&1 | Out-Host
          $global:LASTEXITCODE = 0
          Write-Host "===========================" -ForegroundColor Cyan

          Write-Host ""
          Write-Host "===== TAILSCALE STATUS =====" -ForegroundColor Cyan
          & $ts status 2>&1 | Out-Host
          $global:LASTEXITCODE = 0
          Write-Host "============================" -ForegroundColor Cyan

          $ts_ip = & $ts ip -4 2>&1
          $global:LASTEXITCODE = 0

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : runneradmin" -ForegroundColor Yellow
          Write-Host "  Password     : P@ssw0rd1qazXSW@#" -ForegroundColor Yellow
          Write-Host "  >> Open mstsc and connect to: $ts_ip" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green

      - name: 4. Keep Server Alive (6 Hours)
        shell: pwsh
        run: |
          for ($i = 1; $i -le 355; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/355] Server running..."
          }
